<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roast Alarm — Coming Soon</title>
  <meta name="description" content="Roast Alarm — an alarm clock app. Coming soon.">
  <style>
    :root { color-scheme: light; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(160deg, #fff7ea 0%, #ffe9c9 55%, #ffd9a3 100%);
      color: #33241a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 22px;
    }
    .clock {
      width: 108px; height: 108px;
      border: 7px solid #33241a;
      border-radius: 50%;
      position: relative;
      background: #fffdf8;
      margin-bottom: 28px;
    }
    .clock::before, .clock::after {
      content: ""; position: absolute; left: 50%; bottom: 50%;
      background: #33241a; border-radius: 4px; transform-origin: bottom center;
    }
    .clock::before { width: 7px; height: 30px; transform: translateX(-50%) rotate(0deg); }
    .clock::after { width: 7px; height: 40px; transform: translateX(-50%) rotate(115deg); background: #e06423; }
    .bell { position: absolute; top: -20px; width: 26px; height: 14px; border: 6px solid #33241a; border-bottom: 0; border-radius: 20px 20px 0 0; }
    .bell.left { left: -12px; transform: rotate(-28deg); }
    .bell.right { right: -12px; transform: rotate(28deg); }
    h1 { font-size: 52px; letter-spacing: -0.02em; font-weight: 800; }
    h1 .accent { color: #e06423; }
    p.tag { font-size: 20px; margin-top: 14px; color: #6b5138; max-width: 420px; line-height: 1.45; }
    .pill {
      margin-top: 30px; display: inline-block;
      background: #33241a; color: #ffe9c9;
      font-size: 13.5px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
      padding: 10px 20px; border-radius: 999px;
    }
    footer { margin-top: 54px; font-size: 13.5px; color: #977c5c; }
    @media (max-width: 480px) { h1 { font-size: 40px; } p.tag { font-size: 18px; } }
  </style>
</head>
<body>
  <div class="clock" aria-hidden="true">
    <span class="bell left"></span>
    <span class="bell right"></span>
  </div>
  <h1>Roast <span class="accent">Alarm</span></h1>
  <p class="tag">An alarm clock app is on its way. It will not let you sleep in — and it will not be polite about it.</p>
  <span class="pill">Coming Soon</span>
  <footer>&copy; 2026 Roast Alarm</footer>
</body>
</html>
